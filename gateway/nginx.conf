server {
    listen 8080;

    # Upload limit: 4 MB images work (5m leaves room for multipart overhead)
    client_max_body_size 5m;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /storage/ {
        proxy_pass http://minio:9000/campushub/;
    }
}
